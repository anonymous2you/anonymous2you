<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with anonymous2you</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f8;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
    }

    .page-header {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1f24;
      margin-bottom: 24px;
      text-align: center;
    }

    .tile {
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .target-url {
      font-size: 1.1rem;
      font-weight: 600;
      color: #24292e;
      margin-bottom: 24px;
      word-break: break-all;
      min-height: 1.5em;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
      border: 1px solid transparent;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .btn-copy {
      background-color: #f6f8fa;
      color: #24292e;
      border-color: #d1d5da;
    }

    .btn-copy:hover {
      background-color: #e1e4e8;
    }

    .btn-open {
      background-color: #2ea44f;
      color: #ffffff;
    }

    .btn-open:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="page-header">Chat with anonymous2you</h1>

    <div class="tile">
      <div class="target-url" id="targetLink">https://www.coffeeandfun.com/private-line/?chat=aaa69fee-4e95-4829-abe3-089effcbdd12</div>
      <div class="button-group">
        <button class="btn btn-copy" id="copyBtn" onclick="handleCopy()">Copy Link</button>
        <a class="btn btn-open" id="openBtn" href="https://www.coffeeandfun.com/private-line/?chat=aaa69fee-4e95-4829-abe3-089effcbdd12" target="_blank" rel="noopener noreferrer">Open Link</a>
      </div>
    </div>
  </main>

  <script>
    const DOC_ID = "1gAkQdWNL_CX3FULZr93nCOH97DLhZ-IBPecTRphnlXA";
    const EXPORT_URL = `https://docs.google.com/document/d/${DOC_ID}/export?format=txt`;
    const PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(EXPORT_URL)}`;

    const targetLinkEl = document.getElementById("targetLink");
    const openBtn = document.getElementById("openBtn");
    const copyBtn = document.getElementById("copyBtn");

    let currentUrl = targetLinkEl.innerText.trim();

    async function syncUrlFromDoc() {
      try {
        const res = await fetch(`${PROXY_URL}&_=${Date.now()}`);
        if (!res.ok) return;

        const text = await res.text();
        const match = text.match(/https?:\/\/[^\s\r\n]+/);

        if (match && match[0] && match[0] !== currentUrl) {
          currentUrl = match[0].trim();
          targetLinkEl.innerText = currentUrl;
          openBtn.href = currentUrl;
        }
      } catch (err) {
        console.warn("Doc sync poll failed:", err);
      }
    }

    function handleCopy() {
      navigator.clipboard.writeText(currentUrl).then(() => {
        copyBtn.innerText = "Copied!";
        setTimeout(() => {
          copyBtn.innerText = "Copy Link";
        }, 2000);
      }).catch(() => {
        copyBtn.innerText = "Failed to copy";
      });
    }

    // Initial check on load, then poll every 60 seconds
    syncUrlFromDoc();
    setInterval(syncUrlFromDoc, 60000);
  </script>

</body>
</html>
