<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Room Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .app-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 480px; height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.4); overflow: hidden; }
    .header { position: relative; padding: 16px 52px; background-color: #0f172a; border-bottom: 1px solid #334155; text-align: center; }
    .header h1 { font-size: 1.15rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #refreshBtn { display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center; background: transparent; border: 1px solid #334155; border-radius: 50%; color: #94a3b8; font-size: 1.1rem; line-height: 1; }
    #refreshBtn:hover { background: #334155; color: #f8fafc; }
    #refreshBtn.err { border-color: #ef4444; color: #ef4444; }
    #refreshIcon { display: inline-block; }
    #refreshBtn.spin #refreshIcon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input[type="text"], textarea { padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: #f8fafc; font-size: 0.9rem; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: #38bdf8; }
    button { padding: 12px; border: none; border-radius: 6px; background-color: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    button:hover { background-color: #1d4ed8; }

    #chatArea { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; overflow-anchor: none; }
    .older-btn { align-self: center; padding: 4px 12px; font-size: 0.72rem; font-weight: 500; background: #334155; color: #cbd5e1; border-radius: 999px; }
    .older-btn:hover { background: #475569; }

    .date-sep { align-self: center; font-size: 0.72rem; color: #94a3b8; background: #0f172a; padding: 3px 12px; border-radius: 999px; margin: 6px 0; }

    .row { display: flex; flex-direction: column; max-width: 85%; }
    .row.me { align-self: flex-end; align-items: flex-end; }
    .row.them { align-self: flex-start; align-items: flex-start; }
    .line { display: flex; align-items: center; gap: 6px; max-width: 100%; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; min-width: 0; }
    .msg.incoming { background-color: #334155; color: #f8fafc; }
    .msg.outgoing { background-color: #2563eb; color: #ffffff; }
    .msg .sender-label { font-size: 0.7rem; opacity: 0.75; margin-bottom: 2px; display: block; }
    .msg .body { display: block; white-space: pre-wrap; }
    .msg .time-label { font-size: 0.65rem; opacity: 0.75; margin-top: 4px; display: block; text-align: right; }
    .tick { margin-left: 4px; letter-spacing: -2px; }
    .tick.read { color: #7dd3fc; opacity: 1; font-weight: 700; }

    .react-btn { padding: 2px 6px; font-size: 0.95rem; background: transparent; color: #94a3b8; border-radius: 999px; opacity: 0.55; line-height: 1.2; }
    .react-btn:hover { background: #334155; opacity: 1; }
    .actions { display: flex; align-items: center; flex-shrink: 0; }
    .quote { margin-bottom: 6px; padding: 4px 8px; border-left: 3px solid #7dd3fc; background: rgba(0,0,0,0.22); border-radius: 4px; font-size: 0.78rem; cursor: pointer; }
    .quote .q-name { display: block; font-weight: 600; opacity: 0.9; font-size: 0.7rem; }
    .quote .q-text { opacity: 0.8; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .row.flash .msg { animation: flash 1.2s ease; }
    @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px #38bdf8; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .chip { margin-top: -6px; padding: 1px 8px; font-size: 0.78rem; font-weight: 500; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 999px; z-index: 1; }
    .chip:hover { background: #1e293b; }
    .picker { display: flex; gap: 2px; margin-top: 4px; padding: 4px 6px; background: #0f172a; border: 1px solid #475569; border-radius: 999px; }
    .picker button { padding: 2px 5px; font-size: 1.3rem; background: transparent; border-radius: 999px; }
    .picker button:hover { background: #334155; transform: scale(1.2); }
    .picker button.mine { background: #334155; }
    .details { margin-top: 4px; padding: 8px 10px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; font-size: 0.8rem; min-width: 170px; }
    .details .d-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .details .d-emoji { font-size: 1.1rem; }
    .details .d-title { color: #94a3b8; font-size: 0.7rem; margin-bottom: 4px; }

    .reply-bar { display: none; align-items: center; gap: 8px; padding: 8px 12px; background: #0f172a; border-top: 1px solid #334155; }
    .reply-bar .r-info { flex: 1; min-width: 0; border-left: 3px solid #38bdf8; padding-left: 8px; font-size: 0.78rem; }
    .reply-bar .r-name { display: block; color: #7dd3fc; font-weight: 600; font-size: 0.72rem; }
    .reply-bar .r-text { display: block; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-bar button { padding: 2px 8px; background: transparent; color: #94a3b8; font-size: 1.1rem; }
    .reply-bar button:hover { background: #334155; }

    .chat-input-bar { padding: 12px 12px 4px; background-color: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-bar textarea { flex: 1; resize: none; max-height: 120px; line-height: 1.4; }
    .chat-input-bar button { padding: 10px 16px; }
    .hint { padding: 2px 14px 8px; font-size: 0.68rem; color: #64748b; background-color: #0f172a; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1 id="headerTitle">Anonymous Chat</h1>
      <button id="refreshBtn" title="Refresh chat" aria-label="Refresh chat"><span id="refreshIcon">↻</span></button>
    </div>

    <!-- Login Screen -->
    <div class="panel" id="loginPanel">
      <div class="input-group">
        <label>Your Username:</label>
        <input type="text" id="usernameInput" placeholder="e.g. shadow42" />
      </div>
      <div class="input-group">
        <label>Secret Room Name:</label>
        <input type="text" id="roomInput" placeholder="e.g. vault99" />
      </div>
      <button id="joinBtn">Join Room</button>
    </div>

    <!-- Chat Screen -->
    <div id="chatArea">
      <div class="messages" id="messagesBox"></div>
      <div class="reply-bar" id="replyBar">
        <div class="r-info">
          <span class="r-name" id="replyName"></span>
          <span class="r-text" id="replyText"></span>
        </div>
        <button id="replyCancel" title="Cancel reply">&times;</button>
      </div>
      <div class="chat-input-bar">
        <textarea id="msgInput" rows="1" placeholder="Type a message..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
      <div class="hint">Enter = new line &middot; Ctrl+Enter = send</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, doc, addDoc, updateDoc, writeBatch, deleteField, FieldPath, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2sIW2TFBC3J2usxPGZAErBDikxNndGVU",
      authDomain: "anon-chat-app-bd146.firebaseapp.com",
      projectId: "anon-chat-app-bd146",
      storageBucket: "anon-chat-app-bd146.firebasestorage.app",
      messagingSenderId: "789654062255",
      appId: "1:789654062255:web:5c5e44252ff07fd62e405a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const TZ = "Asia/Dhaka";
    const PAGE = 150; // newest messages loaded per page; "Load earlier messages" adds more
    const REACTIONS = { "❤️": "Love", "😂": "Haha", "😮": "Wow", "😢": "Sad", "😡": "Angry", "👍": "Like" };

    let myName = "", roomName = "", joined = false;
    let store = new Map();            // id -> { id, data, ms, key, pending }
    let ui = { picker: null, details: null };
    let replyTarget = null;
    let pageLimit = PAGE, hasMore = false;
    let unsub = null, subGen = 0, retryTimer = null, retryDelay = 1000;
    const marking = new Set();
    const rowEls = new Map();         // id -> { el, sig }
    const sepEls = new Map();         // dayKey -> element

    const $ = (id) => document.getElementById(id);
    const loginPanel = $("loginPanel"), chatArea = $("chatArea"), messagesBox = $("messagesBox");
    const msgInput = $("msgInput"), headerTitle = $("headerTitle"), refreshBtn = $("refreshBtn");
    const usernameInput = $("usernameInput"), roomInput = $("roomInput"), replyBar = $("replyBar");

    const savedName = localStorage.getItem("anon_username");
    const savedRoom = localStorage.getItem("anon_room");
    if (savedName) usernameInput.value = savedName;
    if (savedRoom) roomInput.value = savedRoom;

    /* ---------- Date helpers (Asia/Dhaka, GMT+6) ---------- */
    const dayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
    const longDayFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", year: "numeric" });
    const timeFmt = new Intl.DateTimeFormat([], { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    const dayKey = (d) => dayFmt.format(d);
    function dayLabel(key, ms) {
      if (key === dayKey(new Date())) return "Today";
      if (key === dayKey(new Date(Date.now() - 86400000))) return "Yesterday";
      return longDayFmt.format(new Date(ms));
    }

    /* ---------- Sound + notifications ---------- */
    let audioCtx = null;
    function ensureAudio() {
      try {
        if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) { /* ignore */ }
    }
    function playSound() {
      try {
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [[880, 0], [1175, 0.13]].forEach(([freq, offset]) => {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = "sine"; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + offset); osc.stop(now + offset + 0.2);
        });
      } catch (e) { /* ignore */ }
    }
    function notifyNewMessage(data) {
      playSound();
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      try {
        const n = new Notification(`${data.sender} · Room ${roomName}`, {
          body: String(data.text || "").slice(0, 160), tag: "anon-chat-" + roomName, renotify: true
        });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (e) { /* some mobile browsers only allow service-worker notifications */ }
    }

    /* ---------- Join ---------- */
    $("joinBtn").addEventListener("click", () => {
      if (joined) return; // prevents duplicate listeners
      myName = usernameInput.value.trim();
      roomName = roomInput.value.trim().toLowerCase();
      if (!myName || !roomName) { alert("Please enter both a username and a room name."); return; }

      localStorage.setItem("anon_username", myName);
      localStorage.setItem("anon_room", roomName);

      ensureAudio();
      if ("Notification" in window && Notification.permission === "default") {
        try { Notification.requestPermission(); } catch (e) { /* ignore */ }
      }

      joined = true;
      loginPanel.style.display = "none";
      chatArea.style.display = "flex";
      refreshBtn.style.display = "flex";
      headerTitle.innerText = `Room: ${roomName}`;
      subscribe("bottom");
    });

    /* ---------- Real-time subscription ---------- */
    function setSyncing(on) { refreshBtn.classList.toggle("spin", on); }

    // mode: "bottom" (scroll to newest after first load) | object anchor (keep scroll position when loading older)
    function subscribe(mode) {
      if (unsub) { unsub(); unsub = null; }
      clearTimeout(retryTimer);
      const gen = ++subGen;
      let first = true;
      setSyncing(true);

      // newest N messages (desc + limit), sorted ascending on the client
      const q = query(collection(db, "chats", roomName, "messages"), orderBy("timestamp", "desc"), limit(pageLimit));

      unsub = onSnapshot(q, { includeMetadataChanges: true }, (snap) => {
        if (gen !== subGen) return;
        retryDelay = 1000;
        setSyncing(false);
        refreshBtn.classList.remove("err");

        snap.docChanges({ includeMetadataChanges: true }).forEach((ch) => {
          if (ch.type === "removed") return; // window shift; keep what we already show
          const d = ch.doc;
          const data = d.data({ serverTimestamps: "estimate" });
          const isNew = !store.has(d.id);
          if (!first && isNew && ch.type === "added" && !d.metadata.hasPendingWrites && data.sender !== myName) notifyNewMessage(data);
          const ms = data.timestamp && data.timestamp.toMillis ? data.timestamp.toMillis() : Date.now();
          store.set(d.id, { id: d.id, data, ms, key: dayKey(new Date(ms)), pending: d.metadata.hasPendingWrites });
        });

        hasMore = snap.size >= pageLimit;
        if (first) {
          scheduleRender(mode === "bottom" ? { bottom: true } : { anchor: mode });
          first = false;
        } else scheduleRender();
        scheduleMarkRead();
      }, (err) => {
        if (gen !== subGen) return;
        console.error("Snapshot error:", err);
        setSyncing(false);
        refreshBtn.classList.add("err");
        retryTimer = setTimeout(() => subscribe(mode === "bottom" ? "bottom" : null), retryDelay);
        retryDelay = Math.min(retryDelay * 2, 15000);
      });
    }

    refreshBtn.addEventListener("click", () => {
      if (!joined) return;
      store = new Map();
      pageLimit = PAGE; hasMore = false;
      ui = { picker: null, details: null };
      retryDelay = 1000;
      subscribe("bottom");
      scheduleRender({ bottom: true });
    });

    window.addEventListener("online", () => { if (joined && refreshBtn.classList.contains("err")) subscribe(null); });

    const olderEl = document.createElement("button");
    olderEl.className = "older-btn";
    olderEl.textContent = "Load earlier messages";
    olderEl.addEventListener("click", () => {
      pageLimit += PAGE;
      subscribe({ h: messagesBox.scrollHeight, t: messagesBox.scrollTop });
    });

    /* ---------- Read receipts (batched) ---------- */
    let markTimer = null;
    function scheduleMarkRead() { clearTimeout(markTimer); markTimer = setTimeout(markRead, 250); }
    async function markRead() {
      if (!joined || document.visibilityState !== "visible") return;
      const ids = [];
      store.forEach((m) => {
        if (m.pending || m.data.sender === myName || marking.has(m.id)) return;
        if (m.data.readBy && m.data.readBy[myName]) return;
        ids.push(m.id);
      });
      if (!ids.length) return;
      ids.forEach((id) => marking.add(id));
      for (let i = 0; i < ids.length; i += 400) {
        const batch = writeBatch(db);
        ids.slice(i, i + 400).forEach((id) => batch.update(doc(db, "chats", roomName, "messages", id), new FieldPath("readBy", myName), true));
        try { await batch.commit(); } catch (e) { console.error("Read receipt failed:", e); }
      }
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { scheduleMarkRead(); scheduleRender(); } });
    window.addEventListener("focus", scheduleMarkRead);

    /* ---------- Reactions ---------- */
    function cleanReactions(raw) {
      const out = [];
      if (raw && typeof raw === "object") {
        Object.keys(raw).forEach((u) => { if (Object.prototype.hasOwnProperty.call(REACTIONS, raw[u])) out.push([u, raw[u]]); });
      }
      return out;
    }
    async function react(m, emoji) {
      const current = m.data.reactions ? m.data.reactions[myName] : undefined;
      ui.picker = null;
      scheduleRender();
      try {
        await updateDoc(doc(db, "chats", roomName, "messages", m.id), new FieldPath("reactions", myName), current === emoji ? deleteField() : emoji);
      } catch (e) {
        console.error("Reaction failed:", e);
        alert("Could not save reaction. Make sure your Firestore rules allow updating messages.");
      }
    }

    /* ---------- Replies ---------- */
    function setReply(m) {
      replyTarget = m;
      $("replyName").textContent = "Replying to " + (m.data.sender === myName ? "yourself" : m.data.sender);
      $("replyText").textContent = String(m.data.text || "").replace(/\s+/g, " ");
      replyBar.style.display = "flex";
      msgInput.focus();
    }
    function clearReply() { replyTarget = null; replyBar.style.display = "none"; }
    function jumpToMessage(id) {
      const entry = rowEls.get(id);
      if (!entry) return;
      const el = entry.el;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1300);
    }
    $("replyCancel").addEventListener("click", clearReply);

    /* ---------- Rendering (keyed, incremental) ---------- */
    const readByOthers = (m) => !!m.data.readBy && Object.keys(m.data.readBy).some((u) => u !== myName && m.data.readBy[u]);

    function signature(m) {
      const rt = m.data.replyTo;
      return JSON.stringify([
        m.data.sender, m.data.text, m.ms, m.pending, readByOthers(m),
        cleanReactions(m.data.reactions), rt ? [rt.id, rt.sender, rt.text] : 0,
        ui.picker === m.id, ui.details === m.id
      ]);
    }

    function buildRow(m) {
      const isMe = m.data.sender === myName;
      const row = document.createElement("div");
      row.className = "row " + (isMe ? "me" : "them");
      row.dataset.id = m.id;

      const line = document.createElement("div");
      line.className = "line";

      const bubble = document.createElement("div");
      bubble.className = "msg " + (isMe ? "outgoing" : "incoming");

      const label = document.createElement("span");
      label.className = "sender-label";
      label.textContent = m.data.sender;
      bubble.appendChild(label);

      const rt = m.data.replyTo;
      if (rt && typeof rt === "object" && rt.text !== undefined) {
        const quote = document.createElement("div");
        quote.className = "quote";
        const qn = document.createElement("span"); qn.className = "q-name"; qn.textContent = rt.sender || "";
        const qt = document.createElement("span"); qt.className = "q-text"; qt.textContent = rt.text;
        quote.appendChild(qn); quote.appendChild(qt);
        quote.title = "Go to original message";
        quote.addEventListener("click", () => { if (rt.id) jumpToMessage(rt.id); });
        bubble.appendChild(quote);
      }

      const body = document.createElement("span");
      body.className = "body";
      body.textContent = m.data.text;
      bubble.appendChild(body);

      const meta = document.createElement("span");
      meta.className = "time-label";
      meta.textContent = timeFmt.format(new Date(m.ms));
      if (isMe) {
        const tick = document.createElement("span");
        tick.className = "tick";
        if (m.pending) tick.textContent = "🕓";
        else if (readByOthers(m)) { tick.textContent = "✓✓"; tick.classList.add("read"); tick.title = "Read"; }
        else { tick.textContent = "✓"; tick.title = "Sent"; }
        meta.appendChild(tick);
      }
      bubble.appendChild(meta);

      const reactBtn = document.createElement("button");
      reactBtn.className = "react-btn";
      reactBtn.textContent = "☺";
      reactBtn.title = "React";
      reactBtn.addEventListener("click", () => { ui.picker = ui.picker === m.id ? null : m.id; scheduleRender(); });

      const replyBtn = document.createElement("button");
      replyBtn.className = "react-btn";
      replyBtn.textContent = "↵";
      replyBtn.title = "Reply";
      replyBtn.addEventListener("click", () => setReply(m));

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.appendChild(reactBtn);
      actions.appendChild(replyBtn);

      if (isMe) { line.appendChild(actions); line.appendChild(bubble); }
      else { line.appendChild(bubble); line.appendChild(actions); }
      row.appendChild(line);

      const reactions = cleanReactions(m.data.reactions);
      if (reactions.length) {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = [...new Set(reactions.map((r) => r[1]))].join("") + (reactions.length > 1 ? " " + reactions.length : "");
        chip.title = "See who reacted";
        chip.addEventListener("click", () => { ui.details = ui.details === m.id ? null : m.id; scheduleRender(); });
        row.appendChild(chip);
      }

      if (ui.picker === m.id) {
        const picker = document.createElement("div");
        picker.className = "picker";
        const mine = m.data.reactions ? m.data.reactions[myName] : null;
        Object.keys(REACTIONS).forEach((emoji) => {
          const b = document.createElement("button");
          b.textContent = emoji;
          b.title = REACTIONS[emoji];
          if (mine === emoji) b.className = "mine";
          b.addEventListener("click", () => react(m, emoji));
          picker.appendChild(b);
        });
        row.appendChild(picker);
      }

      if (ui.details === m.id && reactions.length) {
        const box = document.createElement("div");
        box.className = "details";
        const title = document.createElement("div");
        title.className = "d-title";
        title.textContent = "Reactions";
        box.appendChild(title);
        reactions.forEach(([user, emoji]) => {
          const r = document.createElement("div");
          r.className = "d-row";
          const e = document.createElement("span"); e.className = "d-emoji"; e.textContent = emoji;
          const n = document.createElement("span"); n.textContent = user + (user === myName ? " (you)" : "");
          r.appendChild(e); r.appendChild(n);
          box.appendChild(r);
        });
        row.appendChild(box);
      }
      return row;
    }

    // Coalesce all render requests into one per animation frame
    let renderQueued = false, pendingOpts = {};
    function scheduleRender(opts) {
      if (opts) Object.assign(pendingOpts, opts);
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(renderNow);
    }

    const byOrder = (a, b) => (a.pending !== b.pending ? (a.pending ? 1 : -1) : a.ms - b.ms || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));

    function renderNow() {
      renderQueued = false;
      const opts = pendingOpts; pendingOpts = {};
      const nearBottom = messagesBox.scrollHeight - messagesBox.scrollTop - messagesBox.clientHeight < 80;

      const items = Array.from(store.values()).sort(byOrder);
      const desired = [];
      const usedRows = new Set(), usedSeps = new Set();
      if (hasMore) desired.push(olderEl);

      let lastKey = null;
      for (const m of items) {
        if (m.key !== lastKey) {
          let sep = sepEls.get(m.key);
          if (!sep) { sep = document.createElement("div"); sep.className = "date-sep"; sepEls.set(m.key, sep); }
          const text = dayLabel(m.key, m.ms);
          if (sep.textContent !== text) sep.textContent = text;
          usedSeps.add(m.key);
          desired.push(sep);
          lastKey = m.key;
        }
        const sig = signature(m);
        let entry = rowEls.get(m.id);
        if (!entry || entry.sig !== sig) { entry = { el: buildRow(m), sig }; rowEls.set(m.id, entry); }
        usedRows.add(m.id);
        desired.push(entry.el);
      }

      // Minimal DOM reconciliation
      const want = new Set(desired);
      let cur = messagesBox.firstChild;
      for (const node of desired) {
        while (cur && cur !== node && !want.has(cur)) { const n = cur.nextSibling; messagesBox.removeChild(cur); cur = n; }
        if (node === cur) cur = cur.nextSibling;
        else messagesBox.insertBefore(node, cur);
      }
      while (cur) { const n = cur.nextSibling; messagesBox.removeChild(cur); cur = n; }

      for (const id of rowEls.keys()) if (!usedRows.has(id)) rowEls.delete(id);
      for (const k of sepEls.keys()) if (!usedSeps.has(k)) sepEls.delete(k);

      if (opts.anchor) messagesBox.scrollTop = opts.anchor.t + (messagesBox.scrollHeight - opts.anchor.h);
      else if (opts.bottom || nearBottom) messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    /* ---------- Sending ---------- */
    function autoGrow() {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";
      autoGrow();
      msgInput.focus();

      const target = replyTarget;
      const payload = { sender: myName, text: text, timestamp: serverTimestamp() };
      if (target) {
        payload.replyTo = { id: target.id, sender: target.data.sender, text: String(target.data.text || "").slice(0, 120) };
      }
      clearReply();

      try {
        const p = addDoc(collection(db, "chats", roomName, "messages"), payload); // shows instantly via local write
        scheduleRender({ bottom: true });
        await p;
      } catch (e) {
        console.error("Send failed:", e);
        if (!msgInput.value) { msgInput.value = text; autoGrow(); }
        if (target) setReply(target);
        alert("Message could not be sent. Please try again.");
      }
    }

    $("sendBtn").addEventListener("click", sendMessage);
    msgInput.addEventListener("input", autoGrow);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") clearReply();
      // Enter inserts a new line (default). Ctrl+Enter / Cmd+Enter sends.
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
