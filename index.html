<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with anonymous2you</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f8;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .page-header {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1f24;
      margin-bottom: 24px;
      text-align: center;
    }

    .tile {
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .target-url {
      font-size: 1.25rem;
      font-weight: 600;
      color: #24292e;
      margin-bottom: 24px;
      word-break: break-all;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
      border: 1px solid transparent;
    }

    .btn-copy {
      background-color: #f6f8fa;
      color: #24292e;
      border-color: #d1d5da;
    }

    .btn-copy:hover {
      background-color: #e1e4e8;
    }

    .btn-open {
      background-color: #2ea44f;
      color: #ffffff;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .btn-open:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="page-header">Chat with anonymous2you</h1>

    <div class="tile">
      <div class="target-url" id="targetLink">https://pumpkin.com</div>
      <div class="button-group">
        <button class="btn btn-copy" id="copyBtn" onclick="handleCopy()">Copy Link</button>
        <a class="btn btn-open" href="https://pumpkin.com" target="_blank" rel="noopener noreferrer">Open Link</a>
      </div>
    </div>
  </main>

  <script>
    function handleCopy() {
      const linkText = document.getElementById('targetLink').innerText.trim();
      const copyBtn = document.getElementById('copyBtn');

      navigator.clipboard.writeText(linkText).then(() => {
        copyBtn.innerText = 'Copied!';
        setTimeout(() => {
          copyBtn.innerText = 'Copy Link';
        }, 2000);
      }).catch(() => {
        copyBtn.innerText = 'Failed to copy';
      });
    }
  </script>

</body>
</html>
